<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 400px; height: 400px; display: flex; align-items: center; justify-content: center; background: transparent; }
.avatar {
  width: 400px; height: 400px;
  border-radius: 50%;
  background: linear-gradient(145deg, #f5e6c8 0%, #e8d5a3 30%, #c4a265 70%, #8b6914 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.sky {
  position: absolute; top: 0; left: 0; right: 0; height: 55%;
  background: linear-gradient(180deg, #87CEEB 0%, #B8E6FF 40%, #FFE4B5 80%, #FFDAB9 100%);
  border-radius: 200px 200px 0 0;
}
.sun {
  position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 60px; border-radius: 50%;
  background: radial-gradient(circle, #FFD700, #FFA500);
  box-shadow: 0 0 30px rgba(255,200,0,0.6), 0 0 60px rgba(255,165,0,0.3);
}
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, #7CB342 0%, #558B2F 40%, #33691E 100%);
}
.hills {
  position: absolute; bottom: 45%; left: 0; right: 0; height: 60px;
}
.hill1 {
  position: absolute; bottom: 0; left: -20px;
  width: 200px; height: 80px;
  background: #689F38; border-radius: 50% 50% 0 0;
}
.hill2 {
  position: absolute; bottom: 0; right: -20px;
  width: 250px; height: 70px;
  background: #7CB342; border-radius: 50% 50% 0 0;
}
.house {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  width: 80px; height: 55px;
  background: linear-gradient(135deg, #8D6E63, #6D4C41);
  border-radius: 3px;
}
.roof {
  position: absolute; bottom: 145px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 55px solid transparent;
  border-right: 55px solid transparent;
  border-bottom: 40px solid #D32F2F;
}
.door {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  width: 18px; height: 30px;
  background: #4E342E; border-radius: 9px 9px 0 0;
}
.window1 {
  position: absolute; bottom: 115px; left: calc(50% - 28px);
  width: 16px; height: 14px;
  background: #FFF9C4; border: 2px solid #5D4037; border-radius: 2px;
}
.window2 {
  position: absolute; bottom: 115px; left: calc(50% + 12px);
  width: 16px; height: 14px;
  background: #FFF9C4; border: 2px solid #5D4037; border-radius: 2px;
}
.chicken {
  position: absolute; bottom: 65px; font-size: 32px;
}
.chicken1 { left: 80px; }
.chicken2 { right: 90px; font-size: 28px; }
.sunflower {
  position: absolute; bottom: 85px; font-size: 30px;
}
.sf1 { left: 50px; }
.sf2 { right: 55px; }
.fence {
  position: absolute; bottom: 55px; left: 40px; right: 40px; height: 30px;
  display: flex; gap: 20px; align-items: flex-end;
}
.post {
  width: 6px; height: 25px; background: #A1887F; border-radius: 2px;
}
.rail {
  position: absolute; bottom: 65px; left: 45px; right: 45px; height: 3px;
  background: #A1887F;
}
.rail2 {
  position: absolute; bottom: 73px; left: 45px; right: 45px; height: 3px;
  background: #A1887F;
}
.text-ring {
  position: absolute; bottom: 18px;
  font-family: 'Georgia', serif;
  font-size: 18px; font-weight: bold;
  color: #4E342E;
  text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div class="avatar">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="hills">
    <div class="hill1"></div>
    <div class="hill2"></div>
  </div>
  <div class="ground"></div>
  <div class="roof"></div>
  <div class="house"></div>
  <div class="door"></div>
  <div class="window1"></div>
  <div class="window2"></div>
  <div class="sunflower sf1">🌻</div>
  <div class="sunflower sf2">🌻</div>
  <div class="chicken chicken1">🐔</div>
  <div class="chicken chicken2">🐣</div>
  <div class="rail"></div>
  <div class="rail2"></div>
  <div class="fence">
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
    <div class="post"></div>
  </div>
</div>
</body>
</html>
